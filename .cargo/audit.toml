# cargo-audit ignore list, with justification for each entry.
#
# Keep this list minimal: before adding an entry, check whether a dependency
# upgrade removes the advisory instead. Re-check the existing entries whenever
# the lockfile is refreshed.

[advisories]
ignore = [
  # bitmaps is unmaintained. Maintenance-status warning, not an exploitable
  # vulnerability; the only user is libublk, a direct upstream dependency.
  # There is no patched release (patched = []), and bitmaps is a mandatory,
  # non-optional dependency of libublk 0.4.8 (the latest), so no upgrade or
  # feature change removes it.
  "RUSTSEC-2026-0247",
  # Unsound `Bitmap::try_from(&[u8])` can create invalid values. Not reachable
  # from ubiblk: libublk only constructs bitmaps via `Bitmap::new()` for CPU
  # affinity (libublk-0.4.8/src/ctrl.rs:241,295), never from untrusted byte
  # slices.
  # No patched release exists; see the note above.
  "RUSTSEC-2025-0167",
]
