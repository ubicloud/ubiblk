name: blkbench

# Runs blkbench (https://github.com/ubicloud/blkbench) data-integrity
# verification against ubiblk's vhost-user backend.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  ISA_L_CRYPTO_VERSION: "v2.25.0"

jobs:
  blkbench:
    runs-on: ubicloud-standard-4

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf libtool nasm clang build-essential meson docutils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (registry, git deps, target/)
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Clone and build libblkio
        run: |
          git clone --depth 1 https://gitlab.com/libblkio/libblkio.git
          cd libblkio
          meson setup build --prefix=/usr/local
          meson compile -C build
          sudo --preserve-env=PATH,RUSTUP_HOME,CARGO_HOME,HOME meson install -C build

      - name: Install prebuilt isa-l_crypto
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          archive="isa-l_crypto-${ISA_L_CRYPTO_VERSION}-${arch}.tar.gz"
          url="https://github.com/ubicloud/ubiblk/releases/download/prebuilt-ci-deps/${archive}"
          curl -fL -o "${archive}" "${url}"
          sudo tar -xzf "${archive}" -C /

      # Use actions/checkout rather than a bare `git clone`: it authenticates
      # with the workflow token instead of fetching anonymously, so the step is
      # not subject to GitHub's per-IP unauthenticated rate limits, and it
      # retries transient network failures.
      - name: Check out blkbench
        uses: actions/checkout@v4
        with:
          repository: ubicloud/blkbench
          path: blkbench-src

      - name: Build blkbench
        run: make -C blkbench-src -j"$(nproc)" LDFLAGS="-Wl,-rpath,/usr/local/lib/x86_64-linux-gnu"

      - name: Build ubiblk
        run: cargo build --bin vhost-backend --bin init-metadata

      - name: Verify
        run: |
          set -euo pipefail
          export PATH="$PWD/target/debug:$PWD/blkbench-src:$PATH"
          work="$PWD/target/tests/blkbench"
          rm -rf "$work"
          scripts/blkbench-run "$work/verify-flush" --rw verify-flush --bs 4k
          scripts/blkbench-run "$work/verify-pipeline" --rw verify-pipeline --bs 4k
          scripts/blkbench-run --write-through "$work/write-through" \
            --rw verify-flush --bs 4k

      # 64k writes replace whole 64K stripes, skipping their fetch.
      - name: Verify crash-unsafe copy-on-write
        run: |
          set -euo pipefail
          export PATH="$PWD/target/debug:$PWD/blkbench-src:$PATH"
          work="$PWD/target/tests/blkbench-unsafe"
          rm -rf "$work" && mkdir -p "$work"
          head -c 256M /dev/urandom > "$work/base.raw"
          run() {
            scripts/blkbench-run --base "$work/base.raw" --stripe-size 64K \
              --crash-unsafe "$@"
          }
          run "$work/flush-4k" --rw verify-flush --bs 4k
          run "$work/flush-64k" --rw verify-flush --bs 64k --verify-sectors 1:4
          run "$work/pipeline-4k" --rw verify-pipeline --bs 4k
          run "$work/pipeline-64k" --rw verify-pipeline --bs 64k

      - name: Verify crash-unsafe copy-on-write with write-through
        run: |
          set -euo pipefail
          export PATH="$PWD/target/debug:$PWD/blkbench-src:$PATH"
          work="$PWD/target/tests/blkbench-unsafe-wt"
          rm -rf "$work" && mkdir -p "$work"
          head -c 256M /dev/urandom > "$work/base.raw"
          run() {
            scripts/blkbench-run --base "$work/base.raw" --stripe-size 64K \
              --crash-unsafe --write-through "$@"
          }
          run "$work/flush-4k" --rw verify-flush --bs 4k
          run "$work/flush-64k" --rw verify-flush --bs 64k --verify-sectors 1:4
          run "$work/pipeline-4k" --rw verify-pipeline --bs 4k
          run "$work/pipeline-64k" --rw verify-pipeline --bs 64k

      - name: Dump vhost-backend log
        if: ${{ always() }}
        run: |
          for log in target/tests/blkbench*/*/vhost-backend.log; do
            [ -f "$log" ] || continue
            echo "== $log"
            cat "$log"
          done
